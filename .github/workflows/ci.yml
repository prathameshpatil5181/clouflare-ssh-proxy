name: CI

on:
  push:
    branches: [main]
    # v-prefixed tags are the convention (docs/RELEASING.md), but bare
    # semver tags like 1.0.0 are also accepted — a tag that fails this
    # filter triggers NOTHING, which is invisible until you go looking
    # for files that never reached the release.
    tags: ['v*', '[0-9]*.[0-9]*.[0-9]*']
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux-full:
    # Layers 1-3 (uses user-mode sshd).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install OpenSSH server (sshd for layer 3)
        run: sudo apt-get update && sudo apt-get install -y openssh-server
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: layers 1-2 (unit + integration)
        run: cargo test
      - name: layer 3 (real ssh ProxyCommand e2e)
        run: ./scripts/e2e.sh

  macos-tests:
    # Layers 1-2 on macOS.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  windows-tests:
    # Layers 1-2 on Windows (stdio binary-safety) + GUI compile check.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --features gui --all-targets -- -D warnings
      - run: cargo test

  windows-gui:
    # The GUI app: builds on every push so the artifact is always current.
    # Produces a portable zip (cfssh-gui + cfssh-proxy CLI) — copy anywhere
    # user-writable and run; no installer, no admin rights required.
    runs-on: windows-latest
    permissions:
      contents: write # tag builds attach the zip to the release
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build GUI + CLI (release, no console window in release GUI)
        run: cargo build --release --features gui -p cfssh-proxy
        # Builds BOTH bins so the zip carries cfssh-proxy.exe (the CLI the
        # README's instructions reference) alongside cfssh-gui.exe.
      - name: Package portable zip
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/cfssh-gui.exe   dist/cfssh-gui.exe
          cp target/release/cfssh-proxy.exe dist/cfssh-proxy.exe
          cat > dist/README.txt <<'TXT'
          cfssh-proxy GUI (portable, Windows, no admin needed)

          1. Put these files anywhere user-writable, e.g. %LOCALAPPDATA%\cfssh-proxy
          2. Run cfssh-gui.exe
          3. Type your tunnel host (e.g. ssh.example.com), click Connect
          4. Point IntelliJ/ssh at the shown host:port (default 127.0.0.1:22022)

          "Learn host key" safely pins the sshd fingerprint through the tunnel
          (and is needed again whenever the container/server is recreated).
          TXT
          # The tar in git-bash is GNU tar, which does NOT write zip
          # containers: `-a -f x.zip` produces a POSIX tar archive with a
          # .zip name (verified locally). Windows' native bsdtar at
          # C:\Windows\System32\tar.exe infers zip from the suffix properly.
          /c/Windows/System32/tar.exe -caf ../cfssh-gui-portable.zip -C dist .
          sha256sum cfssh-gui-portable.zip > cfssh-gui-portable.zip.sha256
      - uses: actions/upload-artifact@v4
        if: "!startsWith(github.ref, 'refs/tags/')"
        with:
          name: gui-portable-windows
          path: |
            *.zip
            *.zip.sha256
      # Tag builds: the portable zip is the primary way users consume the
      # app (README's download instructions) — attach it to the release.
      - name: Attach portable zip to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            cfssh-gui-portable.zip
            cfssh-gui-portable.zip.sha256

  release:
    # On tags: build release binaries for all five targets. Accepts both
    # v1.0.0 and 1.0.0 (see the `on.push.tags` note at the top).
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux-full, macos-tests, windows-tests]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu,   ext: '' }
          - { os: ubuntu-latest,  target: aarch64-unknown-linux-gnu, ext: '' }
          - { os: macos-latest,   target: x86_64-apple-darwin,       ext: '' }
          - { os: macos-latest,   target: aarch64-apple-darwin,      ext: '' }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,    ext: '.exe' }
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Extra setup for aarch64-linux cross builds
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
        if: matrix.target == 'aarch64-unknown-linux-gnu'
      - name: Build
        run: |
          cargo build --release --target ${{ matrix.target }}
          cargo build --release --target ${{ matrix.target }} --features gui -p cfssh-proxy --bin cfssh-gui
        if: matrix.target == 'x86_64-pc-windows-msvc'
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
        if: matrix.target != 'x86_64-pc-windows-msvc'
      - name: Rename with platform
        shell: bash
        run: |
          mkdir -p dist
          out="cfssh-proxy-${GITHUB_REF_NAME#v}-${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/cfssh-proxy${{ matrix.ext }}" "dist/${out}${{ matrix.ext }}"
          if [ "${{ matrix.target }}" == "x86_64-pc-windows-msvc" ]; then
            cp "target/${{ matrix.target }}/release/cfssh-gui.exe" "dist/cfssh-gui-${GITHUB_REF_NAME#v}.exe"
          fi
          (cd dist && sha256sum "${out}${{ matrix.ext }}" > "${out}${{ matrix.ext }}.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
