name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux-full:
    # Layers 1-3 (uses user-mode sshd).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install OpenSSH server (sshd for layer 3)
        run: sudo apt-get update && sudo apt-get install -y openssh-server
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: layers 1-2 (unit + integration)
        run: cargo test
      - name: layer 3 (real ssh ProxyCommand e2e)
        run: ./scripts/e2e.sh

  macos-tests:
    # Layers 1-2 on macOS.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  windows-tests:
    # Layers 1-2 on Windows (stdio binary-safety).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  release:
    # On tags: build release binaries for all five targets.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux-full, macos-tests, windows-tests]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu,   ext: '' }
          - { os: ubuntu-latest,  target: aarch64-unknown-linux-gnu, ext: '' }
          - { os: macos-latest,   target: x86_64-apple-darwin,       ext: '' }
          - { os: macos-latest,   target: aarch64-apple-darwin,      ext: '' }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,    ext: '.exe' }
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Extra setup for aarch64-linux cross builds
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
        if: matrix.target == 'aarch64-unknown-linux-gnu'
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Rename with platform
        shell: bash
        run: |
          mkdir -p dist
          out="cfssh-proxy-${GITHUB_REF_NAME#v}-${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/cfssh-proxy${{ matrix.ext }}" "dist/${out}${{ matrix.ext }}"
          (cd dist && sha256sum "${out}${{ matrix.ext }}" > "${out}${{ matrix.ext }}.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
